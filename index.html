<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUCAS FASHION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}
.hero{position:relative;height:100vh;width:100%;overflow:hidden}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity 1.5s;background-size:cover;background-position:center}
.slide.active{opacity:1}
.slide::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.55)}
.content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;text-align:center;width:90%}
.content h1{font-size:54px;font-weight:900;letter-spacing:2px;line-height:1}
.btn{margin-top:22px;display:inline-block;border:1px solid #fff;padding:14px 34px;color:#fff;text-decoration:none;font-size:12px;letter-spacing:3px}
.marquee{position:absolute;bottom:0;left:0;width:100%;background:rgba(0,0,0,.85);padding:10px 0;overflow:hidden;white-space:nowrap;z-index:3;border-top:1px solid #222}
.track{display:inline-block;animation:scroll 20s linear infinite}
.track img{height:75px;width:75px;object-fit:cover;margin:0 12px;border-radius:10px}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
</style>
</head>
<body>
<div class="hero">
<div class="slide active" style="background-image:url('https://images.unsplash.com/photo-1445205170230-053b83016050?w=900')"></div>
<div class="slide" style="background-image:url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=900')"></div>
<div class="slide" style="background-image:url('https://images.unsplash.com/photo-1483985988355-763728e1935b?w=900')"></div>

<div class="content">
<p style="letter-spacing:6px;font-size:11px;margin-bottom:10px">LUCAS FASHION</p>
<h1>STYLE<br>SANS<br>LIMITES</h1>
<a class="btn" href="https://wa.me/15793366483?text=Bonjour%20LUCAS%20FASHION">VOIR COLLECTION</a>
</div>

<div class="marquee">
<div class="track">
<img src="https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=200">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=200">
<img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=200">
<img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=200">
<img src="https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=200">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=200">
</div>
</div>
</div>
<script>
let c=0;const s=document.querySelectorAll('.slide');
setInterval(()=>{s[c].classList.remove('active');c=(c+1)%s.length;s[c].classList.add('active')},6000)
</script>
</body>
</html>
